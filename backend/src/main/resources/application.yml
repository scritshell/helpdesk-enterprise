spring:
  application:
    name: helpdesk-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${SPRING_DATASOURCE_USERNAME:helpdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:helpdesk_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-key-change-this-to-at-least-32-characters}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  seed:
    enabled: ${APP_SEED_ENABLED:true}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
