spring:
  application:
    name: helpdesk-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/helpdesk}
    username: ${SPRING_DATASOURCE_USERNAME:helpdesk}
    password: ${SPRING_DATASOURCE_PASSWORD:helpdesk_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
  servlet:
    multipart:
      max-file-size: ${ATTACHMENTS_MAX_SIZE:10MB}
      max-request-size: ${ATTACHMENTS_MAX_REQUEST_SIZE:11MB}
app:
  cors:
    allowed-origin: ${APP_CORS_ALLOWED_ORIGIN:http://localhost:4200}
  jwt:
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  seed:
    enabled: ${APP_SEED_ENABLED:false}
  attachments:
    storage-path: ${ATTACHMENTS_STORAGE_PATH:./data/attachments}
    max-size-bytes: ${ATTACHMENTS_MAX_SIZE_BYTES:10485760}
management:
  endpoints:
    web:
      exposure:
        include: health,info
server:
  port: 8080
