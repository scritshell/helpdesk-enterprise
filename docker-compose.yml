services:
  postgres:
    image: postgres:16-alpine
    container_name: helpdesk-postgres
    environment:
      POSTGRES_DB: helpdesk
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk_dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: helpdesk-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/helpdesk
      SPRING_DATASOURCE_USERNAME: helpdesk
      SPRING_DATASOURCE_PASSWORD: helpdesk_dev
      APP_CORS_ALLOWED_ORIGIN: ${APP_CORS_ALLOWED_ORIGIN:-http://localhost:4200}
      JWT_SECRET: ${JWT_SECRET:?Define JWT_SECRET en .env usando openssl rand -hex 32}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-30}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-false}
      ATTACHMENTS_STORAGE_PATH: /var/lib/helpdesk/attachments
      ATTACHMENTS_MAX_SIZE: ${ATTACHMENTS_MAX_SIZE:-10MB}
      ATTACHMENTS_MAX_REQUEST_SIZE: ${ATTACHMENTS_MAX_REQUEST_SIZE:-11MB}
      ATTACHMENTS_MAX_SIZE_BYTES: ${ATTACHMENTS_MAX_SIZE_BYTES:-10485760}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - attachments_data:/var/lib/helpdesk/attachments
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: helpdesk-frontend
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  attachments_data:
